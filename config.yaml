models:
  enabled: true
  megadetector_threshold: 0.20
  megadetector_version: "MDV6-yolov10-c"
  miewid_model: "conservationxlabs/miewid-msv3"
  device: "cpu"

blank_filter:
  mode: hybrid
  confidence_threshold: 0.75
  variance_threshold: 120.0
  edge_density_threshold: 0.015

matching:
  auto_match_threshold: 0.85
  review_threshold: 0.60
  max_representatives_per_tiger: 3

alerts:
  core_range_shift_sqkm: 17.5
  buffer_range_shift_km: 5.0
  absence_days_threshold: 30
  buffer_station_proximity_km: 2.0

anomaly:
  enabled: true
  min_frames: 2
  injured_aspect_min: 1.15
  injured_aspect_max: 3.40
  blood_pixel_fraction: 0.04
  mating_window_hours: 6.0
  water_lookback_days: 30
  water_sigma: 2.0

report:
  output_dir: "reports"
  top_alerts: 10

occupancy:
  home_range_method: convex_hull
  min_points_for_range: 3
  overlap_threshold_pct: 10.0

demo:
  synthetic_stations: true   # assign Pench stations when images lack GPS (Amur Tiger zip)

reserve:
  name: "Pench Tiger Reserve (Nagpur Region)"
  center_lat: 21.771
  center_lon: 79.323
  state: "Maharashtra"
  hackathon: "Viksit Nagpur Hackathon"
  core_boundary_file: null
  buffer_boundary_file: null
